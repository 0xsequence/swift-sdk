name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Verify
        run: scripts/verify.sh

      - name: Upload OMSWallet symbol graph
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omswallet-symbol-graph-xcode-27
          path: |
            .build/out/symbolgraph/OMSWallet.symbols.json
            .build/*/symbolgraph/OMSWallet.symbols.json
          if-no-files-found: ignore
          retention-days: 1
